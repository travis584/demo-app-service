name: IaC cost estimate

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'infracost*.yml'
      - '.github/workflows/iac-cost-estimate.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  estimate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: prod
            source_path: terraform/prod
            target_secret: PUMP_IAC_TARGET_ID_PROD
          - stack: staging
            source_path: terraform/staging
            target_secret: PUMP_IAC_TARGET_ID_STAGING

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Breakdown base revision
        run: |
          git checkout --detach "${{ github.event.pull_request.base.sha }}"
          infracost breakdown \
            --path "${{ matrix.source_path }}" \
            --usage-file infracost-usage.yml \
            --format json \
            --out-file /tmp/base.json

      - name: Breakdown proposed revision
        run: |
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          infracost breakdown \
            --path "${{ matrix.source_path }}" \
            --usage-file infracost-usage.yml \
            --format json \
            --out-file /tmp/proposed.json

      # The target-scoped piac_ token resolves company and target server-side.
      # Nothing in this payload is allowed to select a tenant.
      - name: Submit to Pump
        env:
          PUMP_IAC_TOKEN: ${{ secrets.PUMP_IAC_TOKEN }}
          PUMP_API_BASE_URL: ${{ vars.PUMP_API_BASE_URL }}
          TARGET_ID: ${{ secrets[matrix.target_secret] }}
        run: |
          jq -n \
            --arg target_id "$TARGET_ID" \
            --arg source_path "${{ matrix.source_path }}" \
            --argjson repository_id ${{ github.event.repository.id }} \
            --argjson pull_request_number ${{ github.event.pull_request.number }} \
            --arg base_commit_sha "${{ github.event.pull_request.base.sha }}" \
            --arg proposed_commit_sha "${{ github.event.pull_request.head.sha }}" \
            --arg provider_version "$(infracost --version | head -1 | awk '{print $NF}')" \
            --slurpfile base /tmp/base.json \
            --slurpfile proposed /tmp/proposed.json \
            '{
              target_id: $target_id,
              github_repository_id: $repository_id,
              pull_request_number: $pull_request_number,
              source_path: $source_path,
              base_commit_sha: $base_commit_sha,
              proposed_commit_sha: $proposed_commit_sha,
              provider: "infracost",
              provider_version: $provider_version,
              currency: "USD",
              base_result: $base[0],
              proposed_result: $proposed[0]
            }' > /tmp/payload.json

          # 200 is an identical replay, 201 is a new immutable run. Both pass.
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST "$PUMP_API_BASE_URL/api/v1/integrations/iac-estimates/runs" \
            -H "Authorization: Bearer $PUMP_IAC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json)

          cat /tmp/response.json
          case "$status" in
            200|201) echo "submitted (HTTP $status)" ;;
            *) echo "submission failed (HTTP $status)" >&2; exit 1 ;;
          esac
