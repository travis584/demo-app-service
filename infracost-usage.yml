version: 0.1

# Usage estimates for resources Infracost cannot price from Terraform alone.
# Without this file those resources land in `unsupported`/`noPrice` buckets,
# which is itself a useful case to exercise — delete it to produce an
# `unsupported` estimate status instead of `estimated`.
resource_usage:
  google_compute_router_nat.main:
    assigned_vms: 11
    monthly_data_processed_gb: 2500

  google_storage_bucket.artifacts:
    storage_gb: 4000
    monthly_class_a_operations: 500000
    monthly_class_b_operations: 4000000
    monthly_egress_data_transfer_gb:
      same_continent: 800
      worldwide: 150

  google_bigquery_dataset.analytics:
    monthly_active_storage_gb: 2500
    monthly_long_term_storage_gb: 9000
    monthly_streaming_inserts_mb: 120000

  google_bigquery_table.events:
    monthly_queries_tb: 18

  google_pubsub_topic.events:
    monthly_message_data_tb: 1.5

  google_pubsub_subscription.events_worker:
    monthly_message_data_tb: 1.5
    storage_gb: 20

  google_cloud_run_v2_service.api:
    monthly_requests: 3000000
    average_request_duration_ms: 180
    min_instance_count: 0
    concurrent_requests: 40
